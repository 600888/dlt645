name: Publish Python Package to PyPI

# 触发方式：
# 1. 推送 v* 格式的 git tag（如 v2.0.0）-> 自动构建并发布到 PyPI（推荐）
# 2. GitHub Release 发布（types: published）-> 发布到 PyPI
# 3. 手动触发 -> 可选择发布到 TestPyPI 或 PyPI
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to:
        description: 'Publish to (pypi/testpypi)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 完整历史，setuptools-scm 需要从 git tag 派生版本号
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (uv sync)
        run: uv sync

      - name: Run tests
        run: |
          uv run python -m unittest test.test_basic test.test_new_commands test.test_log_control test.test_logging_config

      - name: Show derived version
        run: |
          uv run --with setuptools-scm python -c "from setuptools_scm import get_version; print('Version from tag:', get_version(root='..'))"

      - name: Build package
        run: uv build

      - name: Check distribution
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'testpypi'
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
        # 注意：TestPyPI 与正式 PyPI 是独立系统，使用 OIDC 需先在
        #   https://test.pypi.org 的项目设置中添加同样的 Trusted Publisher
        #   （GitHub / 600888 / dlt645 / workflow: python-publish.yml），
        #   否则手动发布到 TestPyPI 会认证失败。

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # git tag 推送 或 release 发布 或 手动选择 pypi 时发布到正式 PyPI
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'pypi')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # 使用 Trusted Publishing（OIDC）认证：无需维护 API token。
        # 前提：已在 PyPI 项目设置中添加本仓库为 Trusted Publisher
        #   （GitHub / 600888 / dlt645 / workflow: python-publish.yml）。
        # 发布权限由 job 顶部的 permissions.id-token: write 提供。
