name: C++ shared library

on:
  push:
    branches: [main, master, develop]
    tags: ["v*", "cpp-v*"]
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: dlt645-linux-x64
          - os: windows-2022
            artifact: dlt645-windows-x64
          - os: macos-15-intel
            artifact: dlt645-macos-x64
          - os: macos-14
            artifact: dlt645-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Boost headers
        if: runner.os != 'Windows'
        run: |
          curl --fail --location --silent --show-error \
            https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz \
            --output boost.tar.gz
          tar -xzf boost.tar.gz

      - name: Fetch Boost headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe --fail --location --silent --show-error `
            https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz `
            --output boost.tar.gz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xzf boost.tar.gz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        if: runner.os != 'Windows'
        run: >-
          cmake -S cpp -B cpp/build/ci
          -DCMAKE_BUILD_TYPE=Release
          -DBoost_ROOT="${{ github.workspace }}/boost_1_83_0"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S cpp -B cpp/build/ci -G "Visual Studio 17 2022" -A x64
          -DBoost_ROOT="${{ github.workspace }}/boost_1_83_0"

      - name: Build
        run: cmake --build cpp/build/ci --config Release --parallel 4

      - name: Test
        run: ctest --test-dir cpp/build/ci -C Release --output-on-failure

      - name: Install
        run: cmake --install cpp/build/ci --config Release --prefix cpp/build/ci/stage

      - name: Configure installed package consumer
        run: >-
          cmake -S cpp/tests/package_consumer -B cpp/build/package-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/cpp/build/ci/stage"
          -DBoost_ROOT="${{ github.workspace }}/boost_1_83_0"

      - name: Build installed package consumer
        run: cmake --build cpp/build/package-consumer --config Release --parallel 4

      - name: Test installed package consumer
        run: ctest --test-dir cpp/build/package-consumer -C Release --output-on-failure

      - name: Upload shared library package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cpp/build/ci/stage/
          if-no-files-found: error

  release:
    name: Publish C++ release
    needs: build
    if: startsWith(github.ref, 'refs/tags/cpp-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: dlt645-*
          path: release-assets

      - name: Package platform archives
        shell: bash
        run: |
          for package in release-assets/dlt645-*; do
            name="${package##*/}"
            (cd release-assets && zip -qr "${name}.zip" "${name}")
          done

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/*.zip --clobber
          else
            gh release create "$tag" release-assets/*.zip \
              --verify-tag --title "DLT645 C++ ${tag#cpp-v}" \
              --notes "C++ shared library packages for Linux x64, Windows x64, macOS x64 and macOS arm64. Each archive contains the library, headers and CMake package configuration."
          fi
